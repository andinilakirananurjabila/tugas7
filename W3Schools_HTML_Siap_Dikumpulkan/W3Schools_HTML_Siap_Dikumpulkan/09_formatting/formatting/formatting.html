<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting - Tugas W3Schools HTML</title>
    
    <style>
        body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:30px;line-height:1.6;color:#222}
        h1{background:#04AA6D;color:white;padding:18px;border-radius:8px}
        h2{color:#04AA6D}
        table{border-collapse:collapse;width:100%;margin:15px 0}
        th,td{border:1px solid #999;padding:8px;text-align:left}
        th{background:#f1f1f1}
        input,select,textarea,button{padding:8px;margin:4px}
        button{cursor:pointer}
        .example{padding:15px;border:1px solid #ddd;border-radius:6px;background:#fafafa}
        code,pre{background:#f2f2f2;padding:3px}
    </style>
</head>
<body>
    <h1>Formatting</h1>
    <p><b>Tugas HTML W3Schools</b> — contoh dan latihan materi.</p>
    <h2>HTML Formatting</h2><p><b>Bold</b>, <strong>Strong</strong>, <i>Italic</i>, <em>Emphasized</em>, <mark>Marked</mark>, <small>Small</small>, <del>Deleted</del>, <ins>Inserted</ins>, H<sub>2</sub>O, x<sup>2</sup>.</p>
    <hr>
    <p><small>Sumber pembelajaran: W3Schools HTML Tutorial.</small></p>
</body>
</html>
